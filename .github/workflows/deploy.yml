name: Deploy Ember to GitHub Pages

# Why this exists instead of "Settings → Pages → main / root":
# the local PAT cannot touch the Pages API (403 — no `pages` scope), but the
# workflow's own GITHUB_TOKEN can, via `configure-pages` with `enablement:true`.
# Bonus: every push to main now deploys, so a version bump goes live by itself.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Pages (idempotent)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Run the gate before shipping
        run: |
          if [ -f check.sh ]; then bash check.sh; fi

      - name: Stage site
        run: |
          mkdir -p _site
          cp index.html styles.css app.js deck.js audio.js version.js \
             version.json sw.js manifest.json icon.svg _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
